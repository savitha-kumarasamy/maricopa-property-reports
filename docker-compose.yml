services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: maricopa_reports
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/maricopa_reports
      DATABASE_URL_SYNC: postgresql+psycopg2://postgres:postgres@db:5432/maricopa_reports
      MARICOPA_API_TOKEN: ${MARICOPA_API_TOKEN:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:

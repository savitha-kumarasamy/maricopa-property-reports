services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: maricopa_reports
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        MODULE: auth-service
    environment:
      SERVER_PORT: 8081
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: maricopa_reports
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ${SECRET_KEY:-change-me-in-production-use-a-real-secret-key}
    depends_on:
      db:
        condition: service_healthy

  property-service:
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        MODULE: property-service
    environment:
      SERVER_PORT: 8082
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: maricopa_reports
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ${SECRET_KEY:-change-me-in-production-use-a-real-secret-key}
      MARICOPA_API_TOKEN: ${MARICOPA_API_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy

  report-service:
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        MODULE: report-service
    environment:
      SERVER_PORT: 8083
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: maricopa_reports
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ${SECRET_KEY:-change-me-in-production-use-a-real-secret-key}
      PROPERTY_SERVICE_URL: http://property-service:8082
    depends_on:
      db:
        condition: service_healthy
      property-service:
        condition: service_started

  schedule-service:
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        MODULE: schedule-service
    environment:
      SERVER_PORT: 8084
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: maricopa_reports
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ${SECRET_KEY:-change-me-in-production-use-a-real-secret-key}
      REPORT_SERVICE_URL: http://report-service:8083
      PROPERTY_SERVICE_URL: http://property-service:8082
      AUTH_SERVICE_URL: http://auth-service:8081
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy

  gateway:
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        MODULE: gateway
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      AUTH_SERVICE_URI: http://auth-service:8081
      PROPERTY_SERVICE_URI: http://property-service:8082
      REPORT_SERVICE_URI: http://report-service:8083
      SCHEDULE_SERVICE_URI: http://schedule-service:8084
    depends_on:
      - auth-service
      - property-service
      - report-service
      - schedule-service

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - gateway

volumes:
  pgdata:

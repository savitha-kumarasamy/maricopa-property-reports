server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: schedule-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:maricopa_reports}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    property-naming-strategy: SNAKE_CASE
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-use-a-real-secret-key}
  services:
    report-base-url: ${REPORT_SERVICE_URL:http://localhost:8083}
    property-base-url: ${PROPERTY_SERVICE_URL:http://localhost:8082}
    auth-base-url: ${AUTH_SERVICE_URL:http://localhost:8081}
  email:
    from: ${EMAIL_FROM:noreply@maricopa-reports.com}
    from-name: ${EMAIL_FROM_NAME:Maricopa Property Reports}
  scheduler:
    interval-ms: ${SCHEDULER_INTERVAL_MS:300000}

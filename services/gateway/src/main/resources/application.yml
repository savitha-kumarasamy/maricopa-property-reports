server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
        - id: property-service
          uri: ${PROPERTY_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/properties/**
        - id: report-service
          uri: ${REPORT_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/api/reports/**
        - id: schedule-service
          uri: ${SCHEDULE_SERVICE_URI:http://localhost:8084}
          predicates:
            - Path=/api/schedules/**

server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:maricopa_reports}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    property-naming-strategy: SNAKE_CASE

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-use-a-real-secret-key}
    access-token-expire-minutes: ${ACCESS_TOKEN_EXPIRE_MINUTES:30}
    refresh-token-expire-days: ${REFRESH_TOKEN_EXPIRE_DAYS:7}
